    <!-- Critical inline CSS for loader (avoids render-blocking full CSS) -->
    <style>html,body{margin:0;padding:0;background:#fff;color:#1a1a2e;font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}#root{display:flex;flex-direction:column;min-height:100vh;background:#fff}:root{--bg:#ffffff;--surface:#f8f7fc;--card:#ffffff;--text:#1a1a2e;--muted:#6b7280}.loader-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#fff;transition:opacity .8s ease,visibility .8s ease;overflow:hidden}.loader-overlay.fade-out{opacity:0;visibility:hidden;pointer-events:none}.loader-canvas{position:absolute;inset:0;width:100%;height:100%}.loader-text-group{position:absolute;bottom:28%;left:50%;transform:translateX(-50%) translateY(20px);text-align:center;opacity:0;transition:opacity 1s ease,transform 1s cubic-bezier(.16,1,.3,1);z-index:2;pointer-events:none}.loader-text-group.visible{opacity:1;transform:translateX(-50%) translateY(0)}.loader-title{font-size:clamp(13px,1.4vw,20px);font-weight:500;letter-spacing:.4em;color:rgba(26,26,46,.8);margin:0;text-shadow:0 0 30px rgba(102,71,240,.12)}.loader-subtitle{font-size:clamp(9px,.8vw,12px);font-weight:300;letter-spacing:.3em;color:rgba(26,26,46,.3);margin:10px 0 0}</style>
